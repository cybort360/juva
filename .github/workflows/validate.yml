name: Validate

# Every gate that must pass before a release. Ordered cheapest-first inside the
# `validate` script, so a formatting slip fails in seconds rather than after the suite.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install API dependencies
        run: npm --prefix services/api ci

      # `.env` is gitignored and absent in CI. Every check below must pass without it —
      # that is the same "launchable with nothing configured" property the app itself has.
      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Domain tests
        run: npm run test

      - name: API tests
        run: npm run test:api

      - name: Secret scan
        run: npm run secrets

      - name: Dependency audit
        run: npm run audit

      # Advisory, not a gate. expo-doctor currently reports two findings that
      # RELEASE_REPORT.md classifies as KNOWN / ACCEPTED for 1.0: the Hermes V1 memory
      # regression (fixable only by an SDK 57 major, which the feature freeze forbids and
      # which has never been observed in Juva) and eight patch-version mismatches. Left
      # blocking, those two permanently red the pipeline and — worse — stop the Web bundle
      # step below from ever running, so a real bundling failure would be invisible behind
      # a warning we have already decided not to act on.
      #
      # The step still runs and its full output is still printed; it simply cannot fail the
      # job. Every other step here remains a hard gate.
      - name: Expo Doctor (advisory)
        continue-on-error: true
        run: npx expo-doctor

      # Proves the app still bundles. A type error can pass tsc and still fail Metro.
      - name: Web bundle
        run: npx expo export --platform web --output-dir dist
